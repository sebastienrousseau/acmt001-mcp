name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs this package with the `online` extra (httpx) so the live
      # GLEIF lookup tool (verify_lei_online) and its mocked tests are
      # exercised; the core `acmt001` dependency resolves from PyPI. respx
      # mocks the HTTP boundary so tests never touch the network.
      - name: Install this package (+ acmt001 from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[online]"
          pip install pytest pytest-cov respx

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_tool_dispatch.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install this package with the `online` extra (acmt001 resolves from
      # PyPI) so mypy can resolve both `acmt001.services` and the optional
      # `httpx` import inside verify_lei_online.
      - name: Install this package (+ acmt001 from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install ".[online]"
          pip install ruff black mypy

      - name: Ruff check
        run: ruff check acmt001_mcp/ benches/ scripts/

      - name: Black check
        run: black --check acmt001_mcp/ tests/ benches/ scripts/

      - name: Mypy
        run: mypy acmt001_mcp/
