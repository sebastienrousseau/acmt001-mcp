[tool.poetry]
name = "acmt001-mcp"
version = "0.0.14"
description = "Model Context Protocol (MCP) server exposing the acmt001 ISO 20022 Account Management library as agent tools."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/acmt001-mcp"
homepage = "https://acmt001.com"
packages = [
    { include = "acmt001_mcp" },
]

[tool.poetry.scripts]
acmt001-mcp = "acmt001_mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# The suite releases in lockstep: this server ships against the core
# at its own version. (0.0.2 and 0.0.3 also capped cryptography<50.0.0,
# which the floor below rules out.)
acmt001 = ">=0.0.14,<1"
# mcp < 1.30.0 and 2.0.x/2.1.x are affected by GHSA-84m7-p3x7-pcfv
# (unbounded streamable HTTP session accumulation; this server serves
# streamable HTTP), so no affected release can resolve.
mcp = ">=1.30.0,!=2.0.*,!=2.1.*,<3"
# Optional HTTP client for the live GLEIF lookup (verify_lei_online); only
# installed with the ``online`` extra so the base install stays network-free.
httpx = { version = ">=0.27,<1", optional = true }

# Transitive, via `mcp` -> `pyjwt[crypto]`. Nothing in this tree
# constrains it, so a resolver is free to pick a version in the
# >=44.0.0,<50.0.0 range that GHSA flags as high severity.
cryptography = ">=50.0.0"
# Security floors for MCP's transitive async, HTTP, JWT and tracing stack,
# matching pacs008-mcp, so no release with a published advisory can
# resolve.
anyio = ">=4.14.2,<5"
httpx2 = ">=2.12.0"
httpcore2 = { version = ">=2.10.0", markers = "sys_platform != 'emscripten'" }
pyjwt = { version = ">=2.15.0", extras = ["crypto"] }
# mcp 2.x requires opentelemetry-api; < 1.45.1 parses tracestate
# without a bound (GHSA-xcq7-p3pf-p88h).
opentelemetry-api = ">=1.45.1"
# certifi < 2026.10.19 is affected by PYSEC-2026-4320.
certifi = ">=2026.10.19"
[tool.poetry.extras]
online = ["httpx"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.18"
mypy = ">=1.11,<3.0"
bandit = "^1.7.0"
respx = ">=0.21,<1"
hypothesis = ">=6.100,<7"
interrogate = "^1.7.0"
mutmut = ">=3.7,<4"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# The manual is built on Python 3.12 (docs.yml, requirements/docs.txt),
# and the current Sphinx line needs 3.11 or newer, so the group is
# scoped to 3.12+. Unscoped, it had to resolve for the then 3.10
# floor, where no Sphinx >= 8.2.3 exists, and Dependabot's update of it
# failed with "version solving failed".
sphinx = { version = ">=7,<10", python = ">=3.12" }
furo = { version = ">=2024.1", python = ">=3.12" }
myst-parser = { version = ">=3,<6", extras = ["linkify"], python = ">=3.12" }
sphinx-autodoc-typehints = { version = ">=2,<4", python = ">=3.12" }
sphinx-copybutton = { version = ">=0.5,<1", python = ">=3.12" }
sphinxcontrib-mermaid = { version = ">=0.9,<3", python = ">=3.12" }

[tool.poetry.urls]
Documentation = "https://sebastienrousseau.github.io/acmt001-mcp/"
Changelog = "https://github.com/sebastienrousseau/acmt001-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sebastienrousseau/acmt001-mcp/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["tests", "benches", "examples", "docs", "scripts"]

[tool.mutmut]
# Mutation testing (mutmut 3): every tool handler is mutated and each
# mutant must be caught by the fast tests. The stdio end-to-end run and
# the suite conformance file are excluded from the selection because
# they do not test handler logic and dominate runtime.
source_paths = ["acmt001_mcp"]
# The example is executed by a test, so it must exist in mutmut's
# working copy beside the tests.
also_copy = ["examples"]
# The SDK-compat shim branches on the installed MCP SDK version; the
# branches for other versions cannot be reached on one install, so its
# surviving mutants say nothing about the tests. Handlers only.
# _cli.py is argparse wiring: flag names, defaults and help prose. Its
# tests pin the flags and defaults; a mutant of a help sentence or a
# parser description is not a bug a test should have to name. The
# transport dispatch it drives, _transports.run, is mutated.
do_not_mutate = ["acmt001_mcp/_mcp_compat.py", "acmt001_mcp/_cli.py"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "--no-cov"]
pytest_add_cli_args_test_selection = [
    "tests/test_mcp_server.py",
    "tests/test_mcp_sdk_compat.py",
    "tests/test_properties.py",
    "tests/test_transports.py",
    "tests/test_untrusted_text.py",
]

[tool.black]
# The vendored conformance test carries a digest of its own bytes,
# so reformatting it would invalidate the check it exists to make.
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=acmt001_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["acmt001_mcp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]
# The vendored suite conformance file is byte-pinned to its canonical
# copy (black excludes it above for the same reason) and keeps a tomli
# fallback for the suite's 3.10 floor; with this repository on 3.11 that
# branch is dead, and the fix belongs in the canonical copy, not here.
# structured-address-fix (floor 3.12) carries the same ignore.
"tests/test_suite_conformance.py" = ["UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

# The server object comes from the SDK-compat shim, so its decorators
# are untyped from mypy's point of view on either major.
[[tool.mypy.overrides]]
module = "acmt001_mcp.server"
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "acmt001.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "crewai.*",
    "crewai_tools.*",
    "llama_index.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tools mirror the (untyped) acmt001.services facade verbatim, returning
# bare dict/list/str. Relax the two strict checks that signature would trip
# (generic dict/list args and Any propagated from services) while keeping the
# rest of strict mode in force.
module = "acmt001_mcp.*"
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
